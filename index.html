;text-align:center;margin-bottom:15px}.clock{font-size:52px;font-weight:850;letter-spacing:-.04em;margin:10px}.timerbuttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hidden{display:none!important}.bottomnav{display:none}input[type=date]{color-scheme:dark}@media(max-width:600px){.wrap{padding:12px 11px 90px}.top{align-items:start}.hero h2{font-size:23px}.daygrid{gap:7px}.day{padding:10px 8px}.day span{font-size:13px}.fields{gap:6px}.field input{padding:11px 5px;font-size:15px}.exhead{padding:13px}.exbody{padding:0 10px 11px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:20px}.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:4px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#101511f2;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:5}.bottomnav button{flex:1;padding:10px 3px;font-size:12px}.topactions button{padding:8px;font-size:12px}}

<script>
const PLAN={
 Monday:{title:'Upper Body B',focus:'Chest, back, shoulders, triceps, and biceps',items:[

 Wednesday:{title:'Upper Body A',focus:'Pull-up development, chest strength, back, shoulders, and biceps',items:[

const DAYS=['Monday','Wednesday','Friday'];let page='workout',day='Monday',session=null,timerInt=null,timerRemaining=90,timerRunning=false;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadDB(){try{return JSON.parse(localStorage.getItem('strengthLogDB')||'{"sessions":[]}')}catch{return {sessions:[]}}}let db=loadDB();function saveDB(){localStorage.setItem('strengthLogDB',JSON.stringify(db))}function today(){return new Date().toLocaleDateString('en-CA')}function makeSession(d){return {id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),day:d,date:today(),sets:PLAN[d].items.map((e,i)=>{let prev=db.sessions.filter(s=>s.day===d).sort((a,b)=>b.date.localeCompare(a.date))[0];let old=prev?.sets?.[i];return {exercise:e[0],sets:Array.from({length:e[1]},(_,j)=>{let prior=old?.sets?.[j]||{};return {weight:prior.weight||'',reps:prior.reps||'',right:prior.right||'',left:prior.left||'',seconds:prior.seconds||'',done:false}})}}),started:new Date().toISOString()}}
function latest(d){return db.sessions.filter(s=>s.day===d).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))[0]}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(){if(page==='workout')renderWorkout();if(page==='history')renderHistory();if(page==='progress')renderProgress();if(page==='timer')renderTimer()}
function renderWorkout(){let last=latest(day);if(!session||session.day!==day)session=makeSession(day);let completed=session.sets.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),total=session.sets.reduce((a,e)=>a+e.sets.length,0);$('#app').innerHTML=`<section class="hero"><div class="eyebrow">Your 3-day plan</div><h2>Show up. Get stronger.</h2><p>${PLAN[day].focus}. Log each set and compare it directly with your previous session.</p><div class="daygrid">${DAYS.map(d=>`<button class="day" data-day="${d}" style="${day===d?'border-color:var(--accent);background:#1b281b':''}"><strong>${d.toUpperCase().slice(0,3)}</strong><span>${PLAN[d].title}</span><small>${PLAN[d].items.length} exercises</small></button>`).join('')}</div></section><div class="stats"><div class="stat"><strong>${completed}/${total}</strong><span>SETS COMPLETED</span></div><div class="stat"><strong>${db.sessions.length}</strong><span>SESSIONS SAVED</span></div><div class="stat"><strong>${last?esc(last.date):'—'}</strong><span>LAST ${day.toUpperCase()}</span></div></div><div class="sectionhead"><div><div class="eyebrow">${day}</div><h2>${PLAN[day].title}</h2></div><button id="resetSession" class="ghost">Reset</button></div>${last?`<div class="notice">Last session: <b>${esc(last.date)}</b>. Your previous numbers are shown beside each set. Try to match or improve them with good technique.</div>`:''}<label class="muted" for="sessionDate">Workout date</label> <input id="sessionDate" type="date" value="${esc(session.date)}" style="padding:8px;border-radius:9px;background:#101511;border:1px solid var(--line);color:var(--text);margin:5px 0 8px">${session.sets.map((ex,i)=>exerciseHTML(ex,i)).join('')}<div class="exactions"><button class="primary" id="saveSession">Save workout</button><button id="finishSession">Finish & save</button></div><p class="muted" style="font-size:12px">Autosaves this in-progress workout on this device as you type. Tap Save workout to add it to History.</p>`;
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;session=null;renderWorkout()});$('#resetSession').onclick=()=>{if(confirm('Reset current entries for this day?')){session=makeSession(day);renderWorkout()}};$('#sessionDate').onchange=e=>{session.date=e.target.value||today()};document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{let [i,j,k]=el.dataset.field.split(':').map((v,n)=>n<2?Number(v):v);session.sets[i].sets[j][k]=el.value;stashDraft()});document.querySelectorAll('[data-done]').forEach(el=>el.onchange=()=>{let [i,j]=el.dataset.done.split(':').map(Number);session.sets[i].sets[j].done=el.checked;el.closest('.set').classList.toggle('done',el.checked);stashDraft();updateCounts()});document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{let i=+el.dataset.add,arr=session.sets[i].sets,copy=arr.length?{...arr[arr.length-1],done:false}:{weight:'',reps:'',right:'',left:'',seconds:'',done:false};arr.push(copy);stashDraft();renderWorkout()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{let [i,j]=el.dataset.remove.split(':').map(Number);if(session.sets[i].sets.length>1)session.sets[i].sets.splice(j,1);stashDraft();renderWorkout()});$('#saveSession').onclick=()=>saveSession(false);$('#finishSession').onclick=()=>saveSession(true);}
function exerciseHTML(ex,i){let def=PLAN[day].items[i],isTime=def[6]==='time',sides=def[6]==='sides',last=latest(day),prev=last?.sets?.find(e=>e.exercise===def[0]);
function previousValues(j){let p=prev?.sets?.[j];if(!p)return 'No previous result recorded';if(sides)return `${esc(p.weight||'—')} kg · Right ${esc(p.right||'—')} reps · Left ${esc(p.left||'—')} reps`;return `${esc(p.weight||'—')} kg × ${esc(isTime?(p.seconds||'—')+' sec':(p.reps||'—')+' reps')}`}
function goalLine(j){let p=prev?.sets?.[j];if(!p)return 'First time: choose a controlled weight and stay within the target range.';let vals=sides?[Number(p.right||0),Number(p.left||0)]:[Number(isTime?p.seconds||0:p.reps||0)];let max=isTime?60:Number((String(def[2]).match(/(\d+)(?!.*\d)/)||[])[1]||0);let atTop=vals.every(v=>v>=max&&max>0);return atTop?'If all sets reach the top of the range with clean form, increase the weight slightly next time.':'Try to match last time, or add 1 rep/5 seconds with good form.'}
return `<article class="exercise"><div class="exhead"><div class="num">${i+1}</div><div class="exinfo"><h3>${esc(def[0])}</h3><p>${esc(def[5])}</p><div class="exmeta">${def[1]} planned sets · ${esc(def[2])} · Rest target ${esc(def[3])}</div></div></div><div class="exbody">${ex.sets.map((s,j)=>`<div class="set ${s.done?'done':''}"><div class="settop"><span>SET ${j+1}</span><span>${s.done?'Completed':''}</span></div><div class="compare-row previous"><div class="compare-label">LAST SESSION</div><div class="compare-values">${previousValues(j)}</div></div><div class="compare-row current"><div class="compare-label">THIS SESSION</div><div class="compare-values">${sides?`<div class="sidefields"><div class="field"><label>Right reps</label><input type="number" min="0" max="50" inputmode="numeric" placeholder="Reps" value="${esc(s.right)}" data-field="${i}:${j}:right"></div><div class="field"><label>Left reps</label><input type="number" min="0" max="50" inputmode="numeric" placeholder="Reps" value="${esc(s.left)}" data-field="${i}:${j}:left"></div></div><div class="field" style="margin-top:7px"><label>Weight (kg)</label><input type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="kg" value="${esc(s.weight)}" data-field="${i}:${j}:weight"></div>`:`<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Weight (kg)</label><input type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="kg" value="${esc(s.weight)}" data-field="${i}:${j}:weight"></div><div class="field"><label>${isTime?'Seconds held':'Reps'}</label><input type="number" min="0" max="${isTime?'3600':'50'}" inputmode="numeric" placeholder="${isTime?'Seconds':'Reps'}" value="${esc(isTime?s.seconds:s.reps)}" data-field="${i}:${j}:${isTime?'seconds':'reps'}"></div></div>`}</div></div><div class="compare-goal"><strong>Progression:</strong> ${goalLine(j)}</div><div class="setbottom"><label class="check"><input type="checkbox" data-done="${i}:${j}" ${s.done?'checked':''}> Mark set complete</label><div class="setbuttons"><button data-startrest="${def[4]}">▶ Rest ${def[4]}s</button><button class="danger" data-remove="${i}:${j}" ${ex.sets.length===1?'disabled':''}>Remove</button></div></div></div>`).join('')}<div class="exactions"><button data-add="${i}">＋ Add set</button></div></div></article>`}
function stashDraft(){try{localStorage.setItem('strengthLogDraft',JSON.stringify({day,session}))}catch{}}function updateCounts(){let c=session.sets.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),t=session.sets.reduce((a,e)=>a+e.sets.length,0);$('.stats strong').textContent=c+'/'+t}
function saveSession(finish){if(!session.date){alert('Please choose a workout date.');return}let copy=JSON.parse(JSON.stringify(session));copy.savedAt=new Date().toISOString();db.sessions.push(copy);saveDB();localStorage.removeItem('strengthLogDraft');alert(finish?'Workout finished and saved to History.':'Workout saved to History.');session=makeSession(day);renderWorkout()}
function fmtSet(s,def){if(def[6]==='sides')return `${s.weight||'—'} kg × Right ${s.right||'—'} / Left ${s.left||'—'} reps`;if(def[6]==='time')return `${s.weight||'—'} kg × ${s.seconds||'—'} sec`;return `${s.weight||'—'} kg × ${s.reps||'—'} reps`}
function renderHistory(){let sessions=[...db.sessions].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Your training record</div><h2>Workout history</h2></div><span class="muted">${sessions.length} sessions</span></div>${sessions.length?sessions.map(s=>`<article class="historyitem"><div class="historytop"><div><h3>${esc(s.day)} · ${esc(PLAN[s.day]?.title||'Workout')}</h3><div class="muted">${esc(s.date)} · ${s.sets.reduce((a,e)=>a+e.sets.length,0)} sets</div></div><button class="danger" data-delete="${esc(s.id)}">Delete</button></div><details><summary>View every exercise and set</summary><ul class="historylines">${s.sets.map((e,i)=>`<li><b>${esc(e.exercise)}</b><br>${e.sets.map((set,j)=>`Set ${j+1}: ${fmtSet(set,PLAN[s.day].items[i])}${set.done?' ✓':''}`).join('<br>')}</li>`).join('')}</ul><button data-load="${esc(s.id)}">Load this session into workout</button></details></article>`).join(''):`<div class="empty">No saved workouts yet.<br>Log your first session in the Workout tab.</div>`}<div class="exactions"><button id="importBtn">Import backup</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div>`;document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this saved workout?')){db.sessions=db.sessions.filter(s=>s.id!==b.dataset.delete);saveDB();renderHistory()}});document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{let s=db.sessions.find(x=>x.id===b.dataset.load);if(s){day=s.day;session=JSON.parse(JSON.stringify(s));session.id=String(Date.now());setPage('workout')}});$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let x=JSON.parse(await f.text());if(!Array.isArray(x.sessions))throw Error();if(confirm(`Import ${x.sessions.length} sessions? Existing records will be kept.`)){db.sessions.push(...x.sessions);saveDB();renderHistory()}}catch{alert('That backup file could not be read.')}}}
function renderProgress(){let count=db.sessions.length,sets=db.sessions.reduce((a,s)=>a+s.sets.reduce((b,e)=>b+e.sets.length,0),0),done=db.sessions.reduce((a,s)=>a+s.sets.reduce((b,e)=>b+e.sets.filter(x=>x.done).length,0),0);let exNames=[...new Set(Object.values(PLAN).flatMap(d=>d.items.map(e=>e[0])))];$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Consistency over time</div><h2>Your progress</h2></div></div><div class="stats"><div class="stat"><strong>${count}</strong><span>WORKOUTS SAVED</span></div><div class="stat"><strong>${sets}</strong><span>SETS LOGGED</span></div><div class="stat"><strong>${done}</strong><span>SETS MARKED DONE</span></div></div><div class="sectionhead"><h2>Exercise history</h2></div><div class="field"><label>Choose exercise</label><select id="progressExercise" style="width:100%;padding:12px;border-radius:10px;background:var(--panel);color:var(--text);border:1px solid var(--line)">${exNames.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><div id="exerciseProgress"></div><div class="notice">Progress comes from sessions you save here. This first version stores data on this device/browser only. Use Backup to keep a copy or move your history.</div>`;$('#progressExercise').onchange=showExerciseProgress;showExerciseProgress()}
function showExerciseProgress(){let name=$('#progressExercise').value,rows=[];db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.sets.forEach((e,i)=>{if(e.exercise===name)e.sets.forEach((set,j)=>rows.push({date:s.date,set,j,def:PLAN[s.day].items[i]}))}));$('#exerciseProgress').innerHTML=rows.length?`<div class="historyitem"><h3>${esc(name)}</h3><ul class="historylines">${rows.map(r=>`<li>${esc(r.date)} — Set ${r.j+1}: ${fmtSet(r.set,r.def)}</li>`).join('')}</ul></div>`:`<div class="empty">No entries for this exercise yet.</div>`}
function renderTimer(){let secs=timerRemaining;$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Recover between sets</div><h2>Rest timer</h2></div></div><div class="timerbox"><div class="muted">TIME REMAINING</div><div class="clock" id="clock">${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}</div><div class="timerbuttons"><button data-timer="45">45 sec</button><button data-timer="60">60 sec</button><button data-timer="90">90 sec</button><button data-timer="120">2 min</button><button data-timer="180">3 min</button></div><div class="timerbuttons" style="margin-top:15px"><button class="primary" id="timerToggle">${timerRunning?'Pause':'Start timer'}</button><button id="timerReset">Reset</button></div><p class="muted">Timer runs while this page stays open. Keep your phone volume on if you need an audible alert.</p></div><div class="notice">Rest is a timer only; rest duration is not saved in your workout history.</div>`;document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{timerRemaining=+b.dataset.timer;timerRunning=false;clearInterval(timerInt);renderTimer()});$('#timerToggle').onclick=()=>{if(timerRunning){timerRunning=false;clearInterval(timerInt);renderTimer()}else{timerRunning=true;timerInt=setInterval(()=>{timerRemaining--;if(timerRemaining<=0){timerRemaining=0;timerRunning=false;clearInterval(timerInt);if(navigator.vibrate)navigator.vibrate([300,150,300]);try{new AudioContext().resume()}catch{} }let c=$('#clock');if(c)c.textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');if(!timerRemaining){let b=$('#timerToggle');if(b)b.textContent='Start timer'}},1000);renderTimer()}};$('#timerReset').onclick=()=>{timerRunning=false;clearInterval(timerInt);timerRemaining=90;renderTimer()}}
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),sessions:db.sessions},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='strength-log-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};
// Restore an unfinished session if the page was refreshed.
try{let d=JSON.parse(localStorage.getItem('strengthLogDraft')||'null');if(d?.session&&PLAN[d.day]){day=d.day;session=d.session}}catch{}
render();
